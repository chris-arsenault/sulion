[package]
name = "sulion"
version = "0.1.0"
edition = "2021"
publish = false

[features]
integration-tests = []

[lib]
name = "sulion"
path = "src/lib.rs"

[[bin]]
name = "sulion"
path = "src/main.rs"

[[bin]]
name = "sulion-broker"
path = "src/bin/sulion_broker.rs"

[[bin]]
name = "sulion-runner"
path = "src/bin/sulion_runner.rs"

[[bin]]
name = "sulion-retrieval"
path = "src/bin/sulion_retrieval.rs"

[[bin]]
name = "sulion-code-intel"
path = "src/bin/sulion_code_intel.rs"

[[bin]]
name = "sulion-node"
path = "src/bin/sulion_node.rs"

[[bin]]
name = "sulion-ingester"
path = "src/bin/sulion_ingester.rs"

# Declared rather than left to autodiscovery: the e2e stack runs it by name
# from target/debug and from the image, so it is a shipped artifact like the
# rest, not an incidental file in src/bin.
[[bin]]
name = "e2e_seed"
path = "src/bin/e2e_seed.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ast-grep-core = "=0.40.0"
ast-grep-language = "=0.40.0"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }
portable-pty = "0.8"
libc = "0.2"
bytes = "1"
futures = "0.3"
vt100 = "0.15"
walkdir = "2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
jsonwebtoken = "9"
url = "2"
similar = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
ring = "0.17"
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum-server = { version = "0.7.2", default-features = false, features = ["tls-rustls-no-provider"] }
rustls-pemfile = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http = "1"
tempfile = "3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
