# What the deploy still resolves: public identifiers, not secrets.
#
# Every secret here is read by the container that uses it, at start, with the
# identity the trust appliance issued it, from paths declared in compose.yaml
# beside the service (ahara-trust ADR-0002). The database URL is fetched whole
# from /ahara/truenas-db/sulion/<role>/url rather than assembled from parts,
# because compose expands its variables before a container runs.
#
# The Cognito values below are public identifiers. Replacing them with literals
# is a cleanup that needs the deployed values read once.
SULION_AUTH_ISSUER_URL: /ahara/cognito/issuer-url
SULION_AUTH_CLIENT_ID: /ahara/cognito/clients/sulion-app
SULION_COGNITO_USER_POOL_ID: /ahara/cognito/user-pool-id
SULION_COGNITO_CLIENT_ID: /ahara/cognito/clients/sulion-app
