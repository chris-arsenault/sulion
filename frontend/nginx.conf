worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The Ahara reverse proxy preserves the ALB's HTTPS scheme. An ordinary LAN
  # HTTP request has no HSTS policy, and no subdomain-wide policy is asserted.
  map $http_x_forwarded_proto $sulion_hsts {
    default "";
    https "max-age=31536000";
  }

  log_format safe '$remote_addr - $request_method $uri $status $body_bytes_sent';
  access_log /var/log/nginx/access.log safe;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream sulion_backend {
    zone sulion_backend 64k;
    server ${SULION_BACKEND_UPSTREAM} resolve;
  }

  upstream sulion_broker {
    zone sulion_broker 64k;
    server ${SULION_BROKER_UPSTREAM} resolve;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;

    location = /pair { return 404; }
    location ^~ /api/devices/ { return 404; }
    location ~ ^/api/repos/[^/]+/(ingest|raw)$ { return 404; }

    location /api/ {
      # Backend uploads allow 50 MiB per file. Leave room for the multipart
      # envelope while keeping the proxy limit close to the application cap.
      client_max_body_size 51m;
      proxy_pass http://sulion_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # The development-node control channel is deliberately not proxied. Nodes
    # reach the backend directly on its LAN-only published port, which no
    # upstream registration points at, so a node can never pair over the public
    # reverse proxy.
    location = /ws/nodes {
      return 404;
    }

    location /ws {
      proxy_pass http://sulion_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /health {
      proxy_pass http://sulion_backend;
    }

    location /broker/ {
      proxy_pass http://sulion_broker/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location = /retrieval { return 404; }
    location ^~ /retrieval/ { return 404; }
    location = /broker/v1/use { return 404; }
    location ^~ /broker/v1/auth/ { return 404; }
    location = /broker/v1/pty-credentials { return 404; }
    location ^~ /broker/v1/pty-credentials/ { return 404; }

    location = /config.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
