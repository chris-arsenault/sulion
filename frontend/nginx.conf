worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream sulion_backend {
    zone sulion_backend 64k;
    server ${SULION_BACKEND_UPSTREAM} resolve;
  }

  upstream sulion_broker {
    zone sulion_broker 64k;
    server ${SULION_BROKER_UPSTREAM} resolve;
  }

  upstream sulion_retrieval {
    zone sulion_retrieval 64k;
    server ${SULION_RETRIEVAL_UPSTREAM} resolve;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://sulion_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    # The development-node control channel is deliberately not proxied. Nodes
    # reach the backend directly on its LAN-only published port, which no
    # upstream registration points at, so a node can never pair over the public
    # reverse proxy.
    location = /ws/nodes {
      return 404;
    }

    location /ws {
      proxy_pass http://sulion_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location /health {
      proxy_pass http://sulion_backend;
    }

    location /broker/ {
      proxy_pass http://sulion_broker/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location /retrieval/ {
      proxy_pass http://sulion_retrieval/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location = /config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
