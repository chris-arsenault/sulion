project: sulion
prefix: sulion
stack:
  - rust
  - typescript
  - terraform
truenas: true
# TrueNAS topology selector:
#   compose.yaml                            = split control plane
#   deploy/compose.truenas-standalone.yaml = combined TrueNAS host
truenas_compose_path: compose.yaml
truenas_compose_check_paths:
  - compose.yaml
  - deploy/compose.truenas-standalone.yaml
images:
  - backend
  - broker
  - retrieval
  - code-intel
  - runner
  - frontend
rust_artifacts:
  binaries:
    - { bin: sulion, image: backend }
    - { bin: sulion-node, image: backend }
    - { bin: sulion-ingester, image: backend }
    - { bin: sulion-broker, image: broker }
    - { bin: sulion-retrieval, image: retrieval }
    - { bin: sulion-code-intel, image: code-intel }
    - { bin: sulion-runner, image: runner }
