project: sulion
prefix: sulion
stack:
  - rust
  - typescript
  - terraform
truenas: true
# TrueNAS topology selector:
#   compose.yaml                            = split control plane
#   deploy/compose.truenas-standalone.yaml = combined TrueNAS host
truenas_compose_path: compose.yaml
truenas_compose_check_paths:
  - compose.yaml
  - deploy/compose.truenas-standalone.yaml
images:
  - backend
  - broker
  - retrieval
  - code-intel
  - runner
  - frontend
  - devenv
# Every container that holds a secret and runs on TrueNAS needs an identity to
# read it with (ahara-trust ADR-0002). node and ingester run on the dedicated
# host, so they are absent: what they need is delivered over the node channel.
# code-intel is here for the standalone role, which runs it on TrueNAS. runner
# and frontend hold no secret.
truenas_roles_anywhere:
  backend:
    env_prefix: AWS_RA_BACKEND
  broker:
    env_prefix: AWS_RA_BROKER
  retrieval:
    env_prefix: AWS_RA_RETRIEVAL
  code-intel:
    env_prefix: AWS_RA_CODE_INTEL
# The devenv image is the PTY toolset with no per-commit binaries: tagged by
# its directory's git tree hash and skipped entirely when unchanged, so its
# image ID moves only when toolset content does. The node rolls devenv
# containers on image-ID change, never on release.
content_addressed_images:
  - devenv
rust_artifacts:
  binaries:
    - { bin: sulion, image: backend }
    - { bin: sulion-node, image: backend }
    - { bin: sulion-devenv, image: backend }
    - { bin: sulion-ingester, image: backend }
    - { bin: sulion-broker, image: broker }
    - { bin: sulion-retrieval, image: retrieval }
    - { bin: sulion-code-intel, image: code-intel }
    - { bin: sulion-runner, image: runner }
