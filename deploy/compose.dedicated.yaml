services:
  backend:
    profiles:
      - control-plane

  # The tunnel's control end lives with the control plane; the node end is a
  # NixOS interface on this host, not a container.
  node-tunnel:
    profiles:
      - control-plane

  node:
    profiles: !reset []
    network_mode: host
    networks: !reset []
    environment:
      # The control plane's LAN-bound node port, not its public hostname. Node
      # traffic never leaves the LAN and never crosses the public proxy.
      SULION_NODE_CONTROL_URL: ${SULION_NODE_CONTROL_URL:-ws://192.168.66.3:30081/ws/nodes}
      SULION_NODE_ALLOW_INSECURE_WS: "${SULION_NODE_ALLOW_INSECURE_WS:-1}"
      SULION_DOCKER_MODE: direct
      SULION_REPOS_ROOT: /home/sulion/repos
      SULION_WORKSPACES_ROOT: /home/sulion/workspaces
      SULION_CLAUDE_PROJECTS: /home/sulion/.claude/projects
      SULION_CODEX_SESSIONS: /home/sulion/.codex/sessions
      DOCKER_HOST: unix:///var/run/docker.sock
      HOME: /home/sulion
      # Reached over the tunnel, not the public hostname. No node traffic
      # leaves the LAN, and none of it crosses the public reverse proxy.
      SULION_SECRET_BROKER_URL: ${SULION_SECRET_BROKER_URL:-http://10.88.0.1:8081}
      SULION_RETRIEVAL_URL: ${SULION_RETRIEVAL_URL:-http://10.88.0.1:8083}
      SULION_CODE_INTEL_URL: http://127.0.0.1:8084
    volumes: !override
      - ${SULION_HOME_HOST_PATH:-/home/sulion}:/home/sulion
      - ${SULION_NODE_STATE_HOST_PATH:-/var/lib/sulion/node}:/var/lib/sulion-node
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - sulion_run:/run/sulion

  ingester:
    profiles: !reset []
    network_mode: host
    networks: !reset []
    environment:
      SULION_CLAUDE_PROJECTS: /home/sulion/.claude/projects
      SULION_CODEX_SESSIONS: /home/sulion/.codex/sessions
      HOME: /home/sulion
    volumes: !override
      - ${SULION_HOME_HOST_PATH:-/home/sulion}/.claude/projects:/home/sulion/.claude/projects:ro
      - ${SULION_HOME_HOST_PATH:-/home/sulion}/.codex/sessions:/home/sulion/.codex/sessions:ro

  broker:
    profiles:
      - control-plane

  retrieval:
    profiles:
      - control-plane

  code-intel:
    profiles: !reset []
    ports: !override
      - "127.0.0.1:8084:8084"
    environment:
      SULION_CODE_INTEL_ALLOWED_ROOTS: /home/sulion/repos,/home/sulion/workspaces
    volumes: !override
      - ${SULION_REPOS_HOST_PATH:-/home/sulion/repos}:/home/sulion/repos:ro
      - ${SULION_WORKSPACES_HOST_PATH:-/home/sulion/workspaces}:/home/sulion/workspaces:ro

  runner:
    profiles:
      - brokered

  frontend:
    profiles:
      - control-plane

networks:
  sulion:
    driver_opts:
      com.docker.network.bridge.name: sulion0
