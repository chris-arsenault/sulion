services:
  backend:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-backend
    restart: unless-stopped
    ports:
      # Development-node enrollment, bound to the LAN address only. A node
      # cannot reach the tunnel before it has been peered, so this cleartext
      # hop exists to exchange public keys and nothing else; credentials are
      # withheld until a connection arrives over wg0. No upstream registration
      # points at either port, so node pairing is not reachable from the public
      # reverse proxy.
      - "${SULION_NODE_BIND_ADDRESS:-192.168.66.3}:${SULION_NODE_PORT:-30081}:8080"
      # WireGuard endpoint. Declared here rather than on node-tunnel because
      # that container shares this network namespace.
      - "${SULION_NODE_BIND_ADDRESS:-192.168.66.3}:${SULION_TUNNEL_PORT:-51820}:51820/udp"
    environment:
      # DB connects to the shared TrueNAS Postgres (192.168.66.3:5432).
      # DB + role + SSM creds are auto-provisioned by the
      # ahara-db-migrate-truenas Lambda once sulion is registered
      # in ahara-infra/infrastructure/terraform/services/db-migrate-truenas.tf.
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_LISTEN: "0.0.0.0:8080"
      # Public browser-facing origin. Used to build the device-pairing /pair
      # approval link returned by POST /api/devices/pair.
      SULION_PUBLIC_URL: "${SULION_PUBLIC_URL:-https://sulion.services.ahara.io}"
      SULION_DEPLOYMENT_ROLE: "control-plane"
      SULION_NODE_TRANSPORT: "remote"
      # LAN a development node may connect from. Nodes reach the port declared
      # above with no proxy in between, so this is applied to the real TCP
      # peer. SULION_NODE_TRUSTED_PROXY_CIDR is deliberately unset here, which
      # means a forwarded client address is never believed.
      SULION_NODE_LAN_CIDR: "${SULION_NODE_LAN_CIDR:-192.168.66.0/24}"
      # Where nodes dial the tunnel, and the address space it hands out. Setting
      # the endpoint is what turns the tunnel on: unset, credentials are
      # delivered over the LAN hop as before.
      SULION_TUNNEL_ENDPOINT: "${SULION_TUNNEL_ENDPOINT:-192.168.66.3:51820}"
      SULION_TUNNEL_SUBNET: "${SULION_TUNNEL_SUBNET:-10.88.0.0/24}"
      # Forwarded verbatim to a node once an operator approves its identity
      # key. This is the whole reason a dedicated node needs no secrets of its
      # own. Already present in SULION_DB_URL above; named individually here so
      # the node can rebuild its own connection string.
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SULION_POSTGRES_HOST: "${SULION_POSTGRES_HOST:-192.168.66.3}"
      SULION_POSTGRES_PORT: "${SULION_POSTGRES_PORT:-5432}"
      SULION_DB_NAME: "${SULION_DB_NAME:-sulion}"
      SULION_SECRET_BROKER_REGISTRATION_TOKEN: "${SULION_SECRET_BROKER_REGISTRATION_TOKEN}"
      SULION_DOCKER_MODE: "none"
      SULION_REPOS_ROOT: "/var/empty/sulion/repos"
      SULION_WORKSPACES_ROOT: "/var/empty/sulion/workspaces"
      SULION_CLAUDE_PROJECTS: "/var/empty/sulion/claude-projects"
      SULION_CODEX_SESSIONS: "/var/empty/sulion/codex-sessions"
      SULION_CORRELATE_SOCK: "/run/sulion/correlate.sock"
      SULION_AUTH_ISSUER_URL: "${SULION_AUTH_ISSUER_URL:-}"
      SULION_AUTH_CLIENT_ID: "${SULION_AUTH_CLIENT_ID:-}"
      SULION_SECRET_BROKER_URL: "${SULION_SECRET_BROKER_URL:-http://sulion-broker:8081}"
      SULION_RETRIEVAL_URL: "${SULION_RETRIEVAL_URL:-http://sulion-retrieval:8083}"
      SULION_RETRIEVAL_TOKEN: "${SULION_RETRIEVAL_TOKEN}"
      SULION_CODE_INTEL_URL: ""
      SULION_CODE_INTEL_TOKEN: "${SULION_CODE_INTEL_TOKEN:-}"
      SULION_RUNNER_URL: ""
      SULION_DEV_PORT_RANGE: "${SULION_DEV_PORT_RANGE:-26000-26010}"
      HOME: "/home/dev"
    networks:
      - sulion
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  node:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-node
    restart: unless-stopped
    profiles:
      - split-runtime
    user: root
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /opt/sulion/node-entrypoint.sh
    environment:
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_NODE_ID: "${SULION_NODE_ID:-}"
      SULION_NODE_CONTROL_URL: "${SULION_NODE_CONTROL_URL:-}"
      SULION_NODE_ALLOW_INSECURE_WS: "${SULION_NODE_ALLOW_INSECURE_WS:-0}"
      SULION_NODE_PRIVATE_KEY_PATH: "/var/lib/sulion-node/private-key.pk8"
      # Where the node writes what the control plane gave it, and the digest of
      # the configuration this container was already built from. A mismatch is
      # how the node knows the host has not activated the delivery yet.
      SULION_NODE_DELIVERED_CONFIG_PATH: "/var/lib/sulion-node/delivered.env"
      SULION_NODE_CONFIG_DIGEST: "${SULION_NODE_CONFIG_DIGEST:-}"
      # Which control plane paired this node. Written on first pairing and
      # required to match on every connection after, so a machine that later
      # answers on the same address cannot take the node over.
      SULION_NODE_CONTROL_PIN_PATH: "/var/lib/sulion-node/control-key.pub"
      # This node's WireGuard key, and the config it renders from the peering
      # it is granted. Both root-owned; the host applies the config, because
      # the node does not own the host network namespace.
      SULION_NODE_TUNNEL_KEY_PATH: "/var/lib/sulion-node/tunnel-private.key"
      SULION_NODE_TUNNEL_CONF_PATH: "/var/lib/sulion-node/wg0.conf"
      SULION_NODE_RUN_USER: "dev"
      SULION_NODE_RUN_UID: "7321"
      SULION_NODE_RUN_GID: "7321"
      SULION_REPOS_ROOT: "/home/dev/repos"
      SULION_WORKSPACES_ROOT: "/home/dev/workspaces"
      SULION_CLAUDE_PROJECTS: "/home/dev/.claude/projects"
      SULION_CODEX_SESSIONS: "/home/dev/.codex/sessions"
      SULION_CORRELATE_SOCK: "/run/sulion/correlate.sock"
      SULION_SECRET_BROKER_URL: "${SULION_SECRET_BROKER_URL:-http://sulion-broker:8081}"
      SULION_SECRET_BROKER_REGISTRATION_TOKEN: "${SULION_SECRET_BROKER_REGISTRATION_TOKEN}"
      SULION_RETRIEVAL_URL: "${SULION_RETRIEVAL_URL:-http://sulion-retrieval:8083}"
      SULION_RETRIEVAL_TOKEN: "${SULION_RETRIEVAL_TOKEN}"
      SULION_CODE_INTEL_URL: "${SULION_CODE_INTEL_URL:-http://sulion-code-intel:8084}"
      SULION_CODE_INTEL_TOKEN: "${SULION_CODE_INTEL_TOKEN}"
      SULION_DOCKER_MODE: "${SULION_DOCKER_MODE:-direct}"
      SULION_DEV_PORT_RANGE: "${SULION_DEV_PORT_RANGE:-26000-26010}"
      HOME: "/home/dev"
    networks:
      - sulion

  node-tunnel:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-node-tunnel
    restart: unless-stopped
    # Shares the backend's network namespace, so wg0 is an interface the
    # backend binds directly: no forwarding, no address translation, and the
    # node's real tunnel address is what the source check sees. NET_ADMIN lives
    # here rather than on the control process.
    network_mode: "service:backend"
    cap_add:
      - NET_ADMIN
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /usr/local/bin/sulion-node-tunnel
    environment:
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_TUNNEL_SUBNET: "${SULION_TUNNEL_SUBNET:-10.88.0.0/24}"
      SULION_TUNNEL_PORT: "${SULION_TUNNEL_PORT:-51820}"
      HOME: "/home/dev"
    depends_on:
      - backend

  ingester:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-ingester
    restart: unless-stopped
    profiles:
      - split-runtime
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /usr/local/bin/sulion-ingester
    environment:
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_CLAUDE_PROJECTS: "/home/dev/.claude/projects"
      SULION_CODEX_SESSIONS: "/home/dev/.codex/sessions"
      HOME: "/home/dev"
    networks:
      - sulion

  broker:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/broker:${IMAGE_TAG:-latest}
    container_name: sulion-broker
    restart: unless-stopped
    environment:
      SULION_SECRET_BROKER_LISTEN: "0.0.0.0:8081"
      SULION_SECRET_BROKER_DB_URL: "postgres://${BROKER_DB_USER:-unused}:${BROKER_DB_PASSWORD:-unused}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_BROKER_DB_NAME:-sulion_broker}"
      SULION_SECRET_BROKER_MASTER_KEY_PATH: "/var/lib/sulion-broker/master.key"
      SULION_AUTH_ISSUER_URL: "${SULION_AUTH_ISSUER_URL:-}"
      SULION_AUTH_CLIENT_ID: "${SULION_AUTH_CLIENT_ID:-}"
      SULION_SECRET_BROKER_REGISTRATION_TOKEN: "${SULION_SECRET_BROKER_REGISTRATION_TOKEN}"
    networks:
      - sulion
    volumes:
      - ${SULION_BROKER_STATE_HOST_PATH:-/mnt/apps/apps/sulion-broker}:/var/lib/sulion-broker:ro

  retrieval:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/retrieval:${IMAGE_TAG:-latest}
    container_name: sulion-retrieval
    restart: unless-stopped
    environment:
      SULION_RETRIEVAL_LISTEN: "0.0.0.0:8083"
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_RETRIEVAL_TOKEN: "${SULION_RETRIEVAL_TOKEN}"
      SULION_RETRIEVAL_EMBEDDING_URL: "${SULION_RETRIEVAL_EMBEDDING_URL:-http://192.168.66.3:5361}"
      SULION_RETRIEVAL_EMBEDDING_MODEL: "nomic-ai/nomic-embed-text-v1.5"
      SULION_RETRIEVAL_EMBEDDING_DIMENSIONS: "768"
      # Idle cadence for the semantic indexing worker; backlog drains continuously.
      SULION_RETRIEVAL_INDEX_SECONDS: "300"
    networks:
      - sulion

  code-intel:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/code-intel:${IMAGE_TAG:-latest}
    container_name: sulion-code-intel
    restart: unless-stopped
    profiles:
      - node-runtime
    environment:
      SULION_CODE_INTEL_LISTEN: "0.0.0.0:8084"
      SULION_DB_URL: "postgres://${DB_USER}:${DB_PASSWORD}@${SULION_POSTGRES_HOST:-192.168.66.3}:${SULION_POSTGRES_PORT:-5432}/${SULION_DB_NAME:-sulion}"
      SULION_CODE_INTEL_TOKEN: "${SULION_CODE_INTEL_TOKEN}"
      SULION_CODE_INTEL_ALLOWED_ROOTS: "/home/dev/repos,/home/dev/workspaces"
      SULION_CODE_INTEL_LSP_MAX_SERVERS: "6"
      SULION_CODE_INTEL_LSP_IDLE_SECONDS: "1200"
      SULION_CODE_INTEL_LSP_WARMUP_SECONDS: "120"
      SULION_CODE_INTEL_LSP_REQUEST_SECONDS: "10"
    networks:
      - sulion
    volumes:
      - ${SULION_REPOS_HOST_PATH:-/mnt/apps/apps/sulion/repos}:/home/dev/repos:ro
      - ${SULION_WORKSPACES_HOST_PATH:-/mnt/apps/apps/sulion/workspaces}:/home/dev/workspaces:ro

  runner:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/runner:${IMAGE_TAG:-latest}
    container_name: sulion-runner
    restart: unless-stopped
    profiles:
      - brokered
    environment:
      SULION_RUNNER_LISTEN: "0.0.0.0:8082"
      SULION_RUNNER_ALLOWED_ROOTS: "/home/dev/repos,/home/dev/workspaces"
      SULION_RUNNER_DEFAULT_MEMORY: "2g"
      SULION_RUNNER_DEFAULT_CPUS: "2"
      SULION_RUNNER_DEFAULT_PIDS: "512"
    networks:
      - sulion
    volumes:
      # The runner reads the same workspace paths as backend so
      # `docker build .` uses Docker's normal local context handling.
      # The Docker socket is the runner's privileged boundary; backend
      # and PTYs never receive it.
      - ${SULION_SYSTEM_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${SULION_HOME_HOST_PATH:-/mnt/apps/apps/sulion}:/home/dev:ro
      - ${SULION_REPOS_HOST_PATH:-/mnt/apps/apps/sulion/repos}:/home/dev/repos:ro
      - ${SULION_WORKSPACES_HOST_PATH:-/mnt/apps/apps/sulion/workspaces}:/home/dev/workspaces:ro

  frontend:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/frontend:${IMAGE_TAG:-latest}
    container_name: sulion-frontend
    restart: unless-stopped
    ports:
      - "${SULION_FRONTEND_BIND_ADDRESS:-192.168.66.3}:${SULION_FRONTEND_PORT:-30080}:80"
    environment:
      SULION_COGNITO_USER_POOL_ID: "${SULION_COGNITO_USER_POOL_ID:-}"
      SULION_COGNITO_CLIENT_ID: "${SULION_COGNITO_CLIENT_ID:-}"
      SULION_RETRIEVAL_UPSTREAM: "${SULION_RETRIEVAL_UPSTREAM:-retrieval:8083}"
    networks:
      - sulion
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    # No depends_on: the frontend is an nginx serving static files plus a
    # reverse proxy for /api and /ws. It can start independently of the
    # backend — requests to proxied paths 502 until the backend is up,
    # but the UI shell loads either way.

volumes:
  sulion_run:

networks:
  sulion:
    name: ${SULION_NETWORK_NAME:-sulion}
