# Every service below reads its own secrets at start with the identity the
# trust appliance issues it. Nothing here is delivered by a deploy, and the
# database URL is fetched whole rather than assembled from parts — compose
# expands its variables before a container runs, so a container fetching its
# own credentials cannot fill in a connection string built here
# (ahara-trust ADR-0002).
x-sulion-aws: &sulion-aws
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_SDK_LOAD_CONFIG: "1"

# Only services that run on TrueNAS enroll: an identity is issued to a declared
# workload of that site, and node, ingester and code-intel run on the dedicated
# host in the split topology. Those three receive what they need over the node
# channel instead, which is the whole reason a dedicated node is provisioned
# with no credential of its own (ADR-0002).
#
# The backend identity is named as an anchor because the standalone role hosts
# services here that a split deployment runs on the node. The certificate
# directory is under /tmp because these containers run as a non-root user whose
# home is either read-only or a bind mount.
x-sulion-backend-identity: &sulion-backend-identity
  AWS_RA_BACKEND_CERT_DIR: "/tmp/ahara-identity"
  AWS_RA_BACKEND_WORKLOAD_ID: "${AWS_RA_BACKEND_WORKLOAD_ID}"
  AWS_RA_BACKEND_ENROLLMENT_URL: "${AWS_RA_BACKEND_ENROLLMENT_URL}"
  AWS_RA_BACKEND_TRUST_ANCHOR_ARN: "${AWS_RA_BACKEND_TRUST_ANCHOR_ARN}"
  AWS_RA_BACKEND_PROFILE_ARN: "${AWS_RA_BACKEND_PROFILE_ARN}"
  AWS_RA_BACKEND_ENTRY_ROLE_ARN: "${AWS_RA_BACKEND_ENTRY_ROLE_ARN}"
  AWS_RA_BACKEND_ROLE_ARN: "${AWS_RA_BACKEND_ROLE_ARN}"
  AWS_RA_BACKEND_SECRET_SULION_DB_URL: "/ahara/truenas-db/sulion/app/url"
  AWS_RA_BACKEND_SECRET_SULION_SECRET_BROKER_REGISTRATION_TOKEN: "/ahara/sulion/secret-broker-registration-token"
  AWS_RA_BACKEND_SECRET_SULION_RETRIEVAL_TOKEN: "/ahara/sulion/retrieval-token"
  AWS_RA_BACKEND_SECRET_SULION_CODE_INTEL_TOKEN: "/ahara/sulion/code-intel-token"

services:
  backend:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-backend
    restart: unless-stopped
    ports:
      # Development-node control channel, bound to the LAN address only and
      # published to a listener that serves nothing but /ws/nodes — the rest of
      # the API stays behind the frontend proxy on an unpublished port. Direct
      # rather than proxied so the LAN source check sees each node's real
      # address. No upstream registration points at this port, so node pairing
      # is not reachable from the public reverse proxy.
      - "${SULION_NODE_BIND_ADDRESS:-192.168.66.3}:${SULION_NODE_PORT:-30081}:8085"
    environment:
      <<: [*sulion-aws, *sulion-backend-identity]
      SULION_LISTEN: "0.0.0.0:8080"
      # Public browser-facing origin. Used to build the device-pairing /pair
      # approval link returned by POST /api/devices/pair.
      SULION_PUBLIC_URL: "${SULION_PUBLIC_URL:-https://sulion.services.ahara.io}"
      SULION_DEPLOYMENT_ROLE: "control-plane"
      SULION_NODE_TRANSPORT: "remote"
      # LAN a development node may connect from. Nodes reach the port declared
      # above with no proxy in between, so this is applied to the real TCP
      # peer. SULION_NODE_TRUSTED_PROXY_CIDR is deliberately unset here, which
      # means a forwarded client address is never believed.
      SULION_NODE_LAN_CIDR: "${SULION_NODE_LAN_CIDR:-192.168.66.0/24}"
      # Second listener carrying only the node router and the broker/retrieval
      # gateway; the published node port above targets this, never the full
      # API on 8080. Serves TLS with a self-generated certificate whose SANs
      # cover the LAN address nodes dial.
      SULION_NODE_LISTEN: "0.0.0.0:8085"
      SULION_NODE_TLS_SAN: "${SULION_NODE_TLS_SAN:-192.168.66.3}"
      SULION_DOCKER_MODE: "none"
      SULION_REPOS_ROOT: "/var/empty/sulion/repos"
      SULION_WORKSPACES_ROOT: "/var/empty/sulion/workspaces"
      SULION_CLAUDE_PROJECTS: "/var/empty/sulion/claude-projects"
      SULION_CODEX_SESSIONS: "/var/empty/sulion/codex-sessions"
      SULION_CORRELATE_SOCK: "/run/sulion/correlate.sock"
      SULION_AUTH_ISSUER_URL: "${SULION_AUTH_ISSUER_URL:-}"
      SULION_AUTH_CLIENT_ID: "${SULION_AUTH_CLIENT_ID:-}"
      SULION_SECRET_BROKER_URL: "${SULION_SECRET_BROKER_URL:-http://sulion-broker:8081}"
      SULION_RETRIEVAL_URL: "${SULION_RETRIEVAL_URL:-http://sulion-retrieval:8083}"
      SULION_CODE_INTEL_URL: ""
      SULION_RUNNER_URL: ""
      SULION_DEV_PORT_RANGE: "${SULION_DEV_PORT_RANGE:-26000-26010}"
      HOME: "/home/sulion"
    networks:
      - sulion
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  node:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-node
    restart: unless-stopped
    profiles:
      - split-runtime
    user: root
    # The image entrypoint enrolls for a TrueNAS identity before starting; this
    # replaces it, because a node has none and needs none.
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /opt/sulion/node-entrypoint.sh
    environment:
      # Delivered over the node channel after an operator approves this node,
      # then written to root-owned host state the PTY identity cannot read.
      # Empty until that happens, which is what keeps an unapproved machine
      # from running.
      SULION_DB_URL: "${SULION_DB_URL:-}"
      SULION_SECRET_BROKER_REGISTRATION_TOKEN: "${SULION_SECRET_BROKER_REGISTRATION_TOKEN:-}"
      SULION_RETRIEVAL_TOKEN: "${SULION_RETRIEVAL_TOKEN:-}"
      # Not delivered: both ends of this call are on the node's own loopback,
      # so the host generates its own rather than sharing the control plane's.
      SULION_CODE_INTEL_TOKEN: "${SULION_CODE_INTEL_TOKEN:-}"
      SULION_NODE_ID: "${SULION_NODE_ID:-}"
      SULION_NODE_CONTROL_URL: "${SULION_NODE_CONTROL_URL:-}"
      SULION_NODE_ALLOW_INSECURE_WS: "${SULION_NODE_ALLOW_INSECURE_WS:-0}"
      SULION_NODE_PRIVATE_KEY_PATH: "/var/lib/sulion-node/private-key.pk8"
      # Where the node writes what the control plane gave it, and the digest of
      # the configuration this container was already built from. A mismatch is
      # how the node knows the host has not activated the delivery yet.
      SULION_NODE_DELIVERED_CONFIG_PATH: "/var/lib/sulion-node/delivered.env"
      SULION_NODE_CONFIG_DIGEST: "${SULION_NODE_CONFIG_DIGEST:-}"
      # Which control plane paired this node. Written on first pairing and
      # required to match on every connection after, so a machine that later
      # answers on the same address cannot take the node over.
      SULION_NODE_CONTROL_PIN_PATH: "/var/lib/sulion-node/control-key.pub"
      SULION_NODE_RUN_USER: "sulion"
      SULION_NODE_RUN_UID: "7321"
      SULION_NODE_RUN_GID: "7321"
      SULION_REPOS_ROOT: "/home/sulion/repos"
      SULION_WORKSPACES_ROOT: "/home/sulion/workspaces"
      SULION_CLAUDE_PROJECTS: "/home/sulion/.claude/projects"
      SULION_CODEX_SESSIONS: "/home/sulion/.codex/sessions"
      SULION_CORRELATE_SOCK: "/run/sulion/correlate.sock"
      SULION_SECRET_BROKER_URL: "${SULION_SECRET_BROKER_URL:-http://sulion-broker:8081}"
      SULION_RETRIEVAL_URL: "${SULION_RETRIEVAL_URL:-http://sulion-retrieval:8083}"
      SULION_CODE_INTEL_URL: "${SULION_CODE_INTEL_URL:-http://sulion-code-intel:8084}"
      SULION_DOCKER_MODE: "${SULION_DOCKER_MODE:-direct}"
      SULION_DEV_PORT_RANGE: "${SULION_DEV_PORT_RANGE:-26000-26010}"
      HOME: "/home/sulion"
    networks:
      - sulion

  ingester:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/backend:${IMAGE_TAG:-latest}
    container_name: sulion-ingester
    restart: unless-stopped
    profiles:
      - split-runtime
    # The image entrypoint enrolls for a TrueNAS identity before starting; this
    # replaces it, because a node has none and needs none.
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - /usr/local/bin/sulion-ingester
    environment:
      # Delivered over the node channel, exactly as for the node beside it.
      SULION_DB_URL: "${SULION_DB_URL:-}"
      SULION_CLAUDE_PROJECTS: "/home/sulion/.claude/projects"
      SULION_CODEX_SESSIONS: "/home/sulion/.codex/sessions"
      HOME: "/home/sulion"
    networks:
      - sulion

  broker:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/broker:${IMAGE_TAG:-latest}
    container_name: sulion-broker
    restart: unless-stopped
    environment:
      <<: *sulion-aws
      SULION_SECRET_BROKER_LISTEN: "0.0.0.0:8081"
      SULION_SECRET_BROKER_MASTER_KEY_PATH: "/var/lib/sulion-broker/master.key"
      SULION_AUTH_ISSUER_URL: "${SULION_AUTH_ISSUER_URL:-}"
      SULION_AUTH_CLIENT_ID: "${SULION_AUTH_CLIENT_ID:-}"
      # Its state directory is mounted read-only, so the identity goes to /tmp.
      AWS_RA_BROKER_CERT_DIR: "/tmp/ahara-identity"
      AWS_RA_BROKER_WORKLOAD_ID: "${AWS_RA_BROKER_WORKLOAD_ID}"
      AWS_RA_BROKER_ENROLLMENT_URL: "${AWS_RA_BROKER_ENROLLMENT_URL}"
      AWS_RA_BROKER_TRUST_ANCHOR_ARN: "${AWS_RA_BROKER_TRUST_ANCHOR_ARN}"
      AWS_RA_BROKER_PROFILE_ARN: "${AWS_RA_BROKER_PROFILE_ARN}"
      AWS_RA_BROKER_ENTRY_ROLE_ARN: "${AWS_RA_BROKER_ENTRY_ROLE_ARN}"
      AWS_RA_BROKER_ROLE_ARN: "${AWS_RA_BROKER_ROLE_ARN}"
      AWS_RA_BROKER_SECRET_SULION_SECRET_BROKER_DB_URL: "/ahara/truenas-db/sulion/broker/url"
      AWS_RA_BROKER_SECRET_SULION_SECRET_BROKER_REGISTRATION_TOKEN: "/ahara/sulion/secret-broker-registration-token"
    networks:
      - sulion
    volumes:
      - ${SULION_BROKER_STATE_HOST_PATH:-/mnt/apps/apps/sulion-broker}:/var/lib/sulion-broker:ro

  retrieval:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/retrieval:${IMAGE_TAG:-latest}
    container_name: sulion-retrieval
    restart: unless-stopped
    environment:
      <<: *sulion-aws
      SULION_RETRIEVAL_LISTEN: "0.0.0.0:8083"
      AWS_RA_RETRIEVAL_CERT_DIR: "/tmp/ahara-identity"
      AWS_RA_RETRIEVAL_WORKLOAD_ID: "${AWS_RA_RETRIEVAL_WORKLOAD_ID}"
      AWS_RA_RETRIEVAL_ENROLLMENT_URL: "${AWS_RA_RETRIEVAL_ENROLLMENT_URL}"
      AWS_RA_RETRIEVAL_TRUST_ANCHOR_ARN: "${AWS_RA_RETRIEVAL_TRUST_ANCHOR_ARN}"
      AWS_RA_RETRIEVAL_PROFILE_ARN: "${AWS_RA_RETRIEVAL_PROFILE_ARN}"
      AWS_RA_RETRIEVAL_ENTRY_ROLE_ARN: "${AWS_RA_RETRIEVAL_ENTRY_ROLE_ARN}"
      AWS_RA_RETRIEVAL_ROLE_ARN: "${AWS_RA_RETRIEVAL_ROLE_ARN}"
      AWS_RA_RETRIEVAL_SECRET_SULION_DB_URL: "/ahara/truenas-db/sulion/app/url"
      AWS_RA_RETRIEVAL_SECRET_SULION_RETRIEVAL_TOKEN: "/ahara/sulion/retrieval-token"
      SULION_RETRIEVAL_EMBEDDING_URL: "${SULION_RETRIEVAL_EMBEDDING_URL:-http://192.168.66.3:5361}"
      SULION_RETRIEVAL_EMBEDDING_MODEL: "nomic-ai/nomic-embed-text-v1.5"
      SULION_RETRIEVAL_EMBEDDING_DIMENSIONS: "768"
      # Idle cadence for the semantic indexing worker; backlog drains continuously.
      SULION_RETRIEVAL_INDEX_SECONDS: "300"
    networks:
      - sulion

  code-intel:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/code-intel:${IMAGE_TAG:-latest}
    container_name: sulion-code-intel
    restart: unless-stopped
    profiles:
      - node-runtime
    # Its default profile is node-runtime, so this service is described here as
    # it runs on the node: no identity, values from the host beside it. The
    # standalone overlay relocates it onto TrueNAS and enrolls it there.
    entrypoint:
      - /usr/bin/tini
      - --
      - /usr/local/bin/sulion-code-intel
    environment:
      SULION_CODE_INTEL_LISTEN: "0.0.0.0:8084"
      # Delivered over the node channel; the token is generated by the node
      # host, because both ends of this call are on its loopback.
      SULION_DB_URL: "${SULION_DB_URL:-}"
      SULION_CODE_INTEL_TOKEN: "${SULION_CODE_INTEL_TOKEN:-}"
      SULION_CODE_INTEL_ALLOWED_ROOTS: "/home/sulion/repos,/home/sulion/workspaces"
      SULION_CODE_INTEL_LSP_MAX_SERVERS: "6"
      SULION_CODE_INTEL_LSP_IDLE_SECONDS: "1200"
      SULION_CODE_INTEL_LSP_WARMUP_SECONDS: "120"
      SULION_CODE_INTEL_LSP_REQUEST_SECONDS: "10"
    networks:
      - sulion
    volumes:
      - ${SULION_REPOS_HOST_PATH:-/mnt/apps/apps/sulion/repos}:/home/sulion/repos:ro
      - ${SULION_WORKSPACES_HOST_PATH:-/mnt/apps/apps/sulion/workspaces}:/home/sulion/workspaces:ro

  runner:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/runner:${IMAGE_TAG:-latest}
    container_name: sulion-runner
    restart: unless-stopped
    profiles:
      - brokered
    environment:
      SULION_RUNNER_LISTEN: "0.0.0.0:8082"
      SULION_RUNNER_ALLOWED_ROOTS: "/home/sulion/repos,/home/sulion/workspaces"
      SULION_RUNNER_DEFAULT_MEMORY: "2g"
      SULION_RUNNER_DEFAULT_CPUS: "2"
      SULION_RUNNER_DEFAULT_PIDS: "512"
    networks:
      - sulion
    volumes:
      # The runner reads the same workspace paths as backend so
      # `docker build .` uses Docker's normal local context handling.
      # The Docker socket is the runner's privileged boundary; backend
      # and PTYs never receive it.
      - ${SULION_SYSTEM_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${SULION_HOME_HOST_PATH:-/mnt/apps/apps/sulion}:/home/sulion:ro
      - ${SULION_REPOS_HOST_PATH:-/mnt/apps/apps/sulion/repos}:/home/sulion/repos:ro
      - ${SULION_WORKSPACES_HOST_PATH:-/mnt/apps/apps/sulion/workspaces}:/home/sulion/workspaces:ro

  frontend:
    image: ${SULION_IMAGE_REGISTRY:-ghcr.io/chris-arsenault/sulion}/frontend:${IMAGE_TAG:-latest}
    container_name: sulion-frontend
    restart: unless-stopped
    ports:
      - "${SULION_FRONTEND_BIND_ADDRESS:-192.168.66.3}:${SULION_FRONTEND_PORT:-30080}:80"
    environment:
      SULION_COGNITO_USER_POOL_ID: "${SULION_COGNITO_USER_POOL_ID:-}"
      SULION_COGNITO_CLIENT_ID: "${SULION_COGNITO_CLIENT_ID:-}"
      SULION_RETRIEVAL_UPSTREAM: "${SULION_RETRIEVAL_UPSTREAM:-retrieval:8083}"
    networks:
      - sulion
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    # No depends_on: the frontend is an nginx serving static files plus a
    # reverse proxy for /api and /ws. It can start independently of the
    # backend — requests to proxied paths 502 until the backend is up,
    # but the UI shell loads either way.

volumes:
  sulion_run:

networks:
  sulion:
    name: ${SULION_NETWORK_NAME:-sulion}
